<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Last50 AR</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      direction: rtl;
    }

    body {
      overflow: hidden;
    }

    #setupScreen {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      padding: 24px;
      background: #111;
      z-index: 100;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .card {
      margin-top: 24px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 16px;
    }

    .label {
      color: #aaa;
      font-size: 14px;
      margin-top: 16px;
    }

    .value {
      font-size: 21px;
      margin-top: 5px;
    }

    #markerImage {
      width: 100%;
      margin-top: 18px;
      border-radius: 14px;
      display: none;
    }

    #directionBox {
      font-size: 60px;
      text-align: center;
      margin-top: 20px;
    }

    #instructionPreview {
      font-size: 22px;
      text-align: center;
      line-height: 1.5;
      margin-top: 15px;
    }

    #status {
      text-align: center;
      margin-top: 30px;
      color: #aaa;
      line-height: 1.5;
    }

    .error {
      color: #ff6666 !important;
    }

    .success {
      color: #66ff80 !important;
    }

    #startARButton {
      display: none;
      width: 100%;
      padding: 18px;
      margin-top: 25px;
      border: none;
      border-radius: 12px;
      background: #4CAF50;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    #arContainer {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1;
    }

    #arContainer a-scene {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    .a-canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #arOverlay {
      display: none;
      position: fixed;
      z-index: 1000;
      top: calc(env(safe-area-inset-top) + 15px);
      left: 15px;
      right: 15px;
      pointer-events: none;
      text-align: center;
    }

    #arTitle {
      display: inline-block;
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 12px;
      font-size: 18px;
    }

    #arInstruction {
      display: none;
      margin-top: 15px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.78);
      border-radius: 14px;
      font-size: 22px;
      line-height: 1.4;
      color: #66ff80;
    }

    #closeAR {
      position: fixed;
      z-index: 2000;
      top: calc(env(safe-area-inset-top) + 12px);
      left: 15px;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.7);
      color: white;
      font-size: 28px;
      display: none;
    }

  </style>
</head>

<body>


<!-- ==============================
     ROUTE / START SCREEN
============================== -->

<div id="setupScreen">

  <div class="container">

    <h1>Last50</h1>

    <div id="status">
      טוען מסלול...
    </div>

    <div
      id="routeContent"
      style="display:none;"
    >

      <div class="card">

        <div class="label">
          יעד
        </div>

        <div
          id="routeName"
          class="value"
        ></div>


        <div class="label">
          נקודת התחלה
        </div>

        <div
          id="markerName"
          class="value"
        ></div>


        <div class="label">
          חפש את התמונה / המקום הזה
        </div>

        <img
          id="markerImage"
          alt="Marker"
        >

      </div>


      <div class="card">

        <div class="label">
          הוראת ניווט
        </div>

        <div id="directionBox"></div>

        <div id="instructionPreview"></div>

      </div>


      <button
        type="button"
        id="startARButton"
      >
        📷 פתח מצלמת AR
      </button>

    </div>

  </div>

</div>


<!-- ==============================
     AR
============================== -->

<div id="arContainer"></div>

<button id="closeAR">
  ×
</button>

<div id="arOverlay">

  <div id="arTitle">
    כוון את המצלמה ל-Marker
  </div>

  <div id="arInstruction"></div>

</div>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
  "https://batvowvhsqyvacigmzyv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eq-i5YF30iQ03ntmqcg_hA_AJy5NJvK";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==============================
   ELEMENTS
============================== */

const setupScreen =
  document.getElementById(
    "setupScreen"
  );

const status =
  document.getElementById(
    "status"
  );

const routeContent =
  document.getElementById(
    "routeContent"
  );

const routeName =
  document.getElementById(
    "routeName"
  );

const markerName =
  document.getElementById(
    "markerName"
  );

const markerImage =
  document.getElementById(
    "markerImage"
  );

const directionBox =
  document.getElementById(
    "directionBox"
  );

const instructionPreview =
  document.getElementById(
    "instructionPreview"
  );

const startARButton =
  document.getElementById(
    "startARButton"
  );

const arContainer =
  document.getElementById(
    "arContainer"
  );

const arOverlay =
  document.getElementById(
    "arOverlay"
  );

const arInstruction =
  document.getElementById(
    "arInstruction"
  );

const closeAR =
  document.getElementById(
    "closeAR"
  );


let currentRoute = null;


/* ==============================
   DIRECTION
============================== */

function directionToSymbol(direction) {

  switch(direction) {

    case "straight":
      return "⬆️";

    case "left":
      return "⬅️";

    case "right":
      return "➡️";

    case "elevator":
      return "🛗";

    case "stairs":
      return "🪜";

    case "destination":
      return "⭐";

    default:
      return "⬆️";
  }
}


function directionToRotation(direction) {

  switch(direction) {

    case "left":
      return 90;

    case "right":
      return -90;

    case "straight":
      return 0;

    default:
      return 0;
  }
}


/* ==============================
   LOAD ROUTE
============================== */

async function loadRoute() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if (!id) {

    status.className =
      "error";

    status.innerText =
      "❌ לא נמצא Route ID בכתובת";

    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("routes")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {
      throw error;
    }


    if (!data) {

      throw new Error(
        "Route not found"
      );

    }


    currentRoute =
      data;


    routeName.innerText =
      data.name || "";


    markerName.innerText =
      data.marker_name || "";


    instructionPreview.innerText =
      data.instruction || "";


    directionBox.innerText =
      directionToSymbol(
        data.direction
      );


    if (data.marker_url) {

      markerImage.src =
        data.marker_url;

      markerImage.style.display =
        "block";

    }


    if (!data.target_url) {

      throw new Error(
        "למסלול הזה עדיין אין קובץ AR"
      );

    }


    status.className =
      "success";


    status.innerText =
      "✅ המסלול מוכן ל-AR";


    routeContent.style.display =
      "block";


    startARButton.style.display =
      "block";


    console.log(
      "Loaded route:",
      data
    );

  }

  catch(error) {

    console.error(
      error
    );


    status.className =
      "error";


    status.innerText =
      "❌ "
      +
      (
        error.message
        ||
        "לא ניתן לטעון את המסלול"
      );

  }

}


/* ==============================
   CREATE AR SCENE
============================== */

function createARScene() {

  const targetUrl =
    currentRoute.target_url;


  const direction =
    currentRoute.direction;


  const rotation =
    directionToRotation(
      direction
    );


  arContainer.innerHTML = `

    <a-scene

      mindar-image="
        imageTargetSrc: ${targetUrl};
        autoStart: true;
        uiLoading: yes;
        uiScanning: yes;
        uiError: yes;
      "

      color-space="sRGB"

      renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
        antialias: true;
        alpha: true;
      "

      vr-mode-ui="
        enabled: false
      "

      device-orientation-permission-ui="
        enabled: false
      "

      embedded

    >

      <a-camera

        position="0 0 0"

        look-controls="
          enabled: false
        "

      ></a-camera>


      <a-entity

        id="markerTarget"

        mindar-image-target="
          targetIndex: 0
        "

      >

        <!-- AR arrow -->

        <a-entity

          rotation="
            0 0 ${rotation}
          "

          position="
            0 0 0.15
          "

          scale="
            1 1 1
          "

        >

          <!-- Arrow body -->

          <a-box

            position="
              0 0.05 0
            "

            scale="
              0.14 0.45 0.07
            "

            color="#00A8FF"

          ></a-box>


          <!-- Arrow head -->

          <a-cone

            position="
              0 0.42 0
            "

            radius-bottom="0.23"

            radius-top="0"

            height="0.32"

            color="#00A8FF"

          ></a-cone>

        </a-entity>

      </a-entity>

    </a-scene>

  `;


  setTimeout(
    attachTargetEvents,
    500
  );

}


/* ==============================
   TARGET EVENTS
============================== */

function attachTargetEvents() {

  const target =
    document.getElementById(
      "markerTarget"
    );


  if (!target) {

    setTimeout(
      attachTargetEvents,
      300
    );

    return;
  }


  target.addEventListener(
    "targetFound",
    function() {

      console.log(
        "Marker found"
      );


      arInstruction.style.display =
        "block";


      arInstruction.innerHTML =
        directionToSymbol(
          currentRoute.direction
        )
        +
        "<br>"
        +
        (
          currentRoute.instruction
          ||
          ""
        );

    }
  );


  target.addEventListener(
    "targetLost",
    function() {

      console.log(
        "Marker lost"
      );


      arInstruction.style.display =
        "none";

    }
  );

}


/* ==============================
   START AR
============================== */

startARButton.addEventListener(
  "click",
  function() {

    if (
      !currentRoute ||
      !currentRoute.target_url
    ) {

      alert(
        "אין קובץ AR למסלול"
      );

      return;
    }


    setupScreen.style.display =
      "none";


    arContainer.style.display =
      "block";


    arOverlay.style.display =
      "block";


    closeAR.style.display =
      "block";


    createARScene();

  }
);


/* ==============================
   CLOSE AR
============================== */

closeAR.addEventListener(
  "click",
  function() {

    /*
      Easiest clean shutdown of
      camera + MindAR on mobile.
    */

    window.location.reload();

  }
);


/* ==============================
   INIT
============================== */

loadRoute();

</script>

</body>
</html>
