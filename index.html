<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Last50 Multi-Step AR</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      direction: rtl;
    }

    body {
      overflow: hidden;
    }

    #setupScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 24px;
      overflow-y: auto;
      background: #111;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      margin-top: 20px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 15px;
    }

    .label {
      color: #aaa;
      margin-top: 12px;
      font-size: 14px;
    }

    .value {
      margin-top: 5px;
      font-size: 21px;
    }

    #markerImage {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    #startButton,
    #nextButton {
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    #startButton {
      display: none;
      background: #4CAF50;
    }

    #nextButton {
      display: none;
      background: #2196F3;
    }

    #status {
      margin-top: 25px;
      text-align: center;
    }

    .success {
      color: #66ff80;
    }

    .error {
      color: #ff6666;
    }

    #arContainer {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: black;
    }

    #arContainer a-scene {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    #overlay {
      display: none;
      position: fixed;
      top: calc(env(safe-area-inset-top) + 15px);
      left: 15px;
      right: 15px;
      z-index: 1000;
      pointer-events: none;
      text-align: center;
    }

    #overlayBox {
      display: inline-block;
      padding: 14px 18px;
      background: rgba(0, 0, 0, .75);
      border-radius: 14px;
    }

    #instructionBox {
      display: none;
      margin-top: 12px;
      padding: 15px;
      background: rgba(0, 0, 0, .8);
      border-radius: 14px;
      color: #66ff80;
      font-size: 22px;
      line-height: 1.4;
    }

    #nextButtonAR {
      display: none;
      position: fixed;
      bottom: 25px;
      left: 20px;
      right: 20px;
      z-index: 2000;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #2196F3;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    #closeButton {
      display: none;
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      left: 14px;
      z-index: 2000;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, .7);
      color: white;
      font-size: 28px;
    }
  </style>
</head>

<body>

<div id="setupScreen">
  <div class="container">

    <h1>Last50</h1>

    <div id="status">
      טוען מסלול...
    </div>

    <div
      id="routeContent"
      style="display:none;"
    >

      <div class="card">

        <div class="label">
          יעד
        </div>

        <div
          id="routeName"
          class="value"
        ></div>

        <div class="label">
          נקודה נוכחית
        </div>

        <div
          id="stepName"
          class="value"
        ></div>

        <div class="label">
          Marker לחיפוש
        </div>

        <img
          id="markerImage"
          alt="Marker"
        >

      </div>

      <div class="card">

        <div class="label">
          שלב
        </div>

        <div
          id="stepCounter"
          class="value"
        ></div>

        <div class="label">
          הוראה
        </div>

        <div
          id="instructionPreview"
          class="value"
        ></div>

      </div>

      <button
        type="button"
        id="startButton"
      >
        📷 פתח מצלמת AR
      </button>

    </div>

  </div>
</div>


<div id="arContainer"></div>


<div id="overlay">

  <div id="overlayBox">
    מחפש Marker...
  </div>

  <div id="instructionBox"></div>

</div>


<button
  id="nextButtonAR"
  type="button"
>
  ➡️ עבור לנקודה הבאה
</button>


<button
  id="closeButton"
  type="button"
>
  ×
</button>


<script>

/* ==========================================
   CONFIG
========================================== */

const SUPABASE_URL =
  "https://batvowvhsqyvacigmzyv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eq-i5YF30iQ03ntmqcg_hA_AJy5NJvK";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   ELEMENTS
========================================== */

const setupScreen =
  document.getElementById("setupScreen");

const status =
  document.getElementById("status");

const routeContent =
  document.getElementById("routeContent");

const routeName =
  document.getElementById("routeName");

const stepName =
  document.getElementById("stepName");

const markerImage =
  document.getElementById("markerImage");

const stepCounter =
  document.getElementById("stepCounter");

const instructionPreview =
  document.getElementById("instructionPreview");

const startButton =
  document.getElementById("startButton");

const arContainer =
  document.getElementById("arContainer");

const overlay =
  document.getElementById("overlay");

const overlayBox =
  document.getElementById("overlayBox");

const instructionBox =
  document.getElementById("instructionBox");

const nextButtonAR =
  document.getElementById("nextButtonAR");

const closeButton =
  document.getElementById("closeButton");


/* ==========================================
   STATE
========================================== */

let routeData = null;

let steps = [];

let currentStepIndex = 0;


/* ==========================================
   HELPERS
========================================== */

function directionToSymbol(direction) {

  switch (direction) {

    case "straight":
      return "⬆️";

    case "left":
      return "⬅️";

    case "right":
      return "➡️";

    case "elevator":
      return "🛗";

    case "stairs":
      return "🪜";

    case "destination":
      return "⭐";

    default:
      return "⬆️";
  }

}


function directionToRotation(direction) {

  switch (direction) {

    case "left":
      return 90;

    case "right":
      return -90;

    default:
      return 0;
  }

}


/* ==========================================
   LOAD ROUTE + STEPS
========================================== */

async function loadRoute() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const routeId =
    params.get("id");


  if (!routeId) {

    status.className =
      "error";

    status.innerText =
      "❌ לא נמצא Route ID";

    return;
  }


  try {

    const {
      data: route,
      error: routeError
    } =
      await supabaseClient
        .from("routes")
        .select("*")
        .eq("id", routeId)
        .single();


    if (routeError) {
      throw routeError;
    }


    const {
      data: stepRows,
      error: stepsError
    } =
      await supabaseClient
        .from("route_steps")
        .select("*")
        .eq("route_id", routeId)
        .order("step_order", {
          ascending: true
        });


    if (stepsError) {
      throw stepsError;
    }


    routeData =
      route;


    /*
      Backward compatibility:
      if no route_steps exist,
      use the original route marker.
    */

    if (
      !stepRows ||
      stepRows.length === 0
    ) {

      if (!route.target_url) {

        throw new Error(
          "אין נקודות AR במסלול"
        );

      }


      steps = [
        {
          step_order: 1,
          marker_name:
            route.marker_name,

          marker_url:
            route.marker_url,

          target_url:
            route.target_url,

          direction:
            route.direction,

          instruction:
            route.instruction
        }
      ];

    }

    else {

      steps =
        stepRows.filter(
          step =>
            !!step.target_url
        );


      if (steps.length === 0) {

        throw new Error(
          "לנקודות במסלול אין קבצי AR"
        );

      }

    }


    routeName.innerText =
      route.name || "";


    currentStepIndex =
      0;


    showCurrentStep();


    status.className =
      "success";


    status.innerText =
      "✅ המסלול מוכן";


    routeContent.style.display =
      "block";


    startButton.style.display =
      "block";

  }

  catch(error) {

    console.error(
      error
    );


    status.className =
      "error";


    status.innerText =
      "❌ "
      +
      (
        error.message
        ||
        "לא ניתן לטעון מסלול"
      );

  }

}


/* ==========================================
   SHOW STEP INFO
========================================== */

function showCurrentStep() {

  const step =
    steps[currentStepIndex];


  stepName.innerText =
    step.marker_name || "";


  stepCounter.innerText =
    (
      currentStepIndex + 1
    )
    +
    " מתוך "
    +
    steps.length;


  instructionPreview.innerText =
    directionToSymbol(
      step.direction
    )
    +
    " "
    +
    (
      step.instruction
      ||
      ""
    );


  if (step.marker_url) {

    markerImage.src =
      step.marker_url;

    markerImage.style.display =
      "block";

  }

  else {

    markerImage.style.display =
      "none";

  }

}


/* ==========================================
   CREATE AR FOR CURRENT STEP
========================================== */

function createARScene() {

  const step =
    steps[currentStepIndex];


  const rotation =
    directionToRotation(
      step.direction
    );


  arContainer.innerHTML = `

    <a-scene

      mindar-image="
        imageTargetSrc: ${step.target_url};
        autoStart: true;
        uiLoading: yes;
        uiScanning: yes;
        uiError: yes;
      "

      color-space="sRGB"

      renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
        antialias: true;
        alpha: true;
      "

      vr-mode-ui="
        enabled: false
      "

      device-orientation-permission-ui="
        enabled: false
      "

      embedded

    >

      <a-camera
        position="0 0 0"
        look-controls="
          enabled: false
        "
      ></a-camera>


      <a-entity
        id="markerTarget"

        mindar-image-target="
          targetIndex: 0
        "
      >

        <a-entity
          rotation="
            0 0 ${rotation}
          "

          position="
            0 0 0.15
          "
        >

          <a-box
            position="0 0.05 0"
            scale="0.14 0.45 0.07"
            color="#00A8FF"
          ></a-box>


          <a-cone
            position="0 0.42 0"
            radius-bottom="0.23"
            radius-top="0"
            height="0.32"
            color="#00A8FF"
          ></a-cone>

        </a-entity>

      </a-entity>

    </a-scene>

  `;


  overlayBox.innerText =
    "מחפש Marker "
    +
    (
      currentStepIndex + 1
    )
    +
    " מתוך "
    +
    steps.length;


  instructionBox.style.display =
    "none";


  nextButtonAR.style.display =
    "none";


  setTimeout(
    attachTargetEvents,
    500
  );

}


/* ==========================================
   MARKER EVENTS
========================================== */

function attachTargetEvents() {

  const target =
    document.getElementById(
      "markerTarget"
    );


  if (!target) {

    setTimeout(
      attachTargetEvents,
      300
    );

    return;
  }


  target.addEventListener(
    "targetFound",
    function() {

      const step =
        steps[
          currentStepIndex
        ];


      overlayBox.innerText =
        "✅ Marker זוהה";


      instructionBox.innerHTML =
        directionToSymbol(
          step.direction
        )
        +
        "<br>"
        +
        (
          step.instruction
          ||
          ""
        );


      instructionBox.style.display =
        "block";


      /*
        Show next button only if
        another step exists.
      */

      if (
        currentStepIndex
        <
        steps.length - 1
      ) {

        nextButtonAR.style.display =
          "block";

      }

      else {

        nextButtonAR.innerText =
          "⭐ הגעת ליעד";

        nextButtonAR.style.display =
          "block";

      }

    }
  );


  target.addEventListener(
    "targetLost",
    function() {

      overlayBox.innerText =
        "Marker אבד";

    }
  );

}


/* ==========================================
   START AR
========================================== */

startButton.addEventListener(
  "click",
  function() {

    setupScreen.style.display =
      "none";


    arContainer.style.display =
      "block";


    overlay.style.display =
      "block";


    closeButton.style.display =
      "block";


    createARScene();

  }
);


/* ==========================================
   NEXT STEP
========================================== */

nextButtonAR.addEventListener(
  "click",
  function() {

    /*
      Final step
    */

    if (
      currentStepIndex
      >=
      steps.length - 1
    ) {

      alert(
        "⭐ הגעת ליעד"
      );

      return;
    }


    currentStepIndex++;


    /*
      Easiest and most stable way
      to stop current camera /
      MindAR scene and load the
      next .mind target.
    */

    const params =
      new URLSearchParams(
        window.location.search
      );


    params.set(
      "step",
      currentStepIndex
    );


    window.location.search =
      params.toString();

  }
);


/* ==========================================
   CLOSE
========================================== */

closeButton.addEventListener(
  "click",
  function() {

    window.location.reload();

  }
);


/* ==========================================
   INITIAL STEP FROM URL
========================================== */

async function init() {

  await loadRoute();


  const params =
    new URLSearchParams(
      window.location.search
    );


  const requestedStep =
    parseInt(
      params.get("step"),
      10
    );


  if (
    !isNaN(requestedStep)
    &&
    requestedStep >= 0
    &&
    requestedStep < steps.length
  ) {

    currentStepIndex =
      requestedStep;


    showCurrentStep();

  }

}


/* ==========================================
   GO
========================================== */

init();

</script>

</body>
</html>
