<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Last50 Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 22px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      direction: rtl;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 4px;
    }

    h2 {
      text-align: center;
      color: #aaa;
      margin-top: 0;
    }

    h3 {
      margin-top: 0;
    }

    .section {
      margin-top: 24px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 16px;
    }

    .stepTitle {
      color: #66ff80;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border-radius: 9px;
      border: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      margin-top: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #preview {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    #compileButton {
      background: #2196f3;
      color: white;
    }

    #saveStepButton {
      display: none;
      background: #4caf50;
      color: white;
    }

    #addStepButton {
      display: none;
      background: #ff9800;
      color: white;
    }

    #finishButton {
      display: none;
      background: #9c27b0;
      color: white;
    }

    #status,
    #saveStatus {
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      color: #66ff80;
    }

    .error {
      color: #ff6666;
    }

    .infoBox {
      margin-top: 20px;
      background: #252525;
      border-radius: 12px;
      padding: 15px;
    }

    .stepRow {
      padding: 12px;
      margin-top: 10px;
      background: #292929;
      border-radius: 10px;
    }

    .routeBox {
      direction: ltr;
      text-align: left;
      word-break: break-all;
      padding: 15px;
      background: #252525;
      border-radius: 12px;
      margin-top: 18px;
    }

    .routeBox a {
      color: #66ff80;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Last50</h1>
  <h2>Multi-Step Admin</h2>


  <!-- ROUTE -->

  <div class="section">

    <h3>מסלול</h3>

    <label>
      שם היעד
    </label>

    <input
      id="routeName"
      type="text"
      placeholder="לדוגמה: חדר שרתים"
    >

    <div
      id="routeInfo"
      class="infoBox"
      style="display:none;"
    ></div>

  </div>


  <!-- STEP -->

  <div class="section">

    <div
      id="stepTitle"
      class="stepTitle"
    >
      נקודה 1
    </div>


    <label>
      שם הנקודה
    </label>

    <input
      id="markerName"
      type="text"
      placeholder="לדוגמה: כניסה למשרד"
    >


    <label>
      תמונת Marker
    </label>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img
      id="preview"
      alt="Marker preview"
    >


    <button
      type="button"
      id="compileButton"
    >
      צור Marker AR
    </button>


    <div id="status">
      ממתין לתמונה...
    </div>


    <label>
      כיוון
    </label>

    <select id="direction">

      <option value="straight">
        ⬆️ ישר
      </option>

      <option value="left">
        ⬅️ שמאלה
      </option>

      <option value="right">
        ➡️ ימינה
      </option>

      <option value="elevator">
        🛗 מעלית
      </option>

      <option value="stairs">
        🪜 מדרגות
      </option>

      <option value="destination">
        ⭐ הגעת ליעד
      </option>

    </select>


    <label>
      הוראה למשתמש
    </label>

    <textarea
      id="instruction"
      placeholder="לדוגמה: המשך ישר 10 מטר ואז פנה ימינה"
    ></textarea>


    <button
      type="button"
      id="saveStepButton"
    >
      שמור נקודה
    </button>

  </div>


  <div id="saveStatus"></div>


  <!-- SAVED STEPS -->

  <div
    id="savedStepsSection"
    class="section"
    style="display:none;"
  >

    <h3>נקודות שנשמרו</h3>

    <div id="savedSteps"></div>

  </div>


  <button
    type="button"
    id="addStepButton"
  >
    ➕ הוסף נקודה נוספת
  </button>


  <button
    type="button"
    id="finishButton"
  >
    ✅ סיים מסלול
  </button>


  <div id="finalResult"></div>

</div>


<script>

/* ==================================================
   CONFIG
================================================== */

const SUPABASE_URL =
  "https://batvowvhsqyvacigmzyv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eq-i5YF30iQ03ntmqcg_hA_AJy5NJvK";

const COMPILER_URL =
  "https://last50-compiler-production.up.railway.app/compile";

const STORAGE_BUCKET =
  "markers";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   ELEMENTS
================================================== */

const routeName =
  document.getElementById("routeName");

const routeInfo =
  document.getElementById("routeInfo");

const stepTitle =
  document.getElementById("stepTitle");

const markerName =
  document.getElementById("markerName");

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const compileButton =
  document.getElementById("compileButton");

const status =
  document.getElementById("status");

const direction =
  document.getElementById("direction");

const instruction =
  document.getElementById("instruction");

const saveStepButton =
  document.getElementById("saveStepButton");

const saveStatus =
  document.getElementById("saveStatus");

const addStepButton =
  document.getElementById("addStepButton");

const finishButton =
  document.getElementById("finishButton");

const savedStepsSection =
  document.getElementById("savedStepsSection");

const savedSteps =
  document.getElementById("savedSteps");

const finalResult =
  document.getElementById("finalResult");


/* ==================================================
   STATE
================================================== */

let routeId = null;

let currentStepOrder = 1;

let selectedFile = null;

let currentMarkerUrl = null;

let currentTargetUrl = null;

let markerReady = false;

let savedStepData = [];


/* ==================================================
   IMAGE SELECT
================================================== */

imageInput.addEventListener(
  "change",
  function(event) {

    selectedFile =
      event.target.files[0];

    markerReady =
      false;

    currentMarkerUrl =
      null;

    currentTargetUrl =
      null;

    saveStepButton.style.display =
      "none";


    if (!selectedFile) {

      preview.style.display =
        "none";

      status.className = "";

      status.innerText =
        "ממתין לתמונה...";

      return;
    }


    const imageURL =
      URL.createObjectURL(
        selectedFile
      );


    preview.src =
      imageURL;

    preview.style.display =
      "block";


    status.className = "";

    status.innerText =
      "התמונה מוכנה. לחץ על צור Marker AR.";

  }
);


/* ==================================================
   CONVERT IMAGE TO JPEG
================================================== */

function convertImageToJpeg(file) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();


      const imageURL =
        URL.createObjectURL(
          file
        );


      img.onload =
        function() {

          try {

            const MAX_SIZE =
              1600;


            let width =
              img.naturalWidth;

            let height =
              img.naturalHeight;


            if (
              width > MAX_SIZE ||
              height > MAX_SIZE
            ) {

              const scale =
                Math.min(
                  MAX_SIZE / width,
                  MAX_SIZE / height
                );


              width =
                Math.round(
                  width * scale
                );


              height =
                Math.round(
                  height * scale
                );

            }


            const canvas =
              document.createElement(
                "canvas"
              );


            canvas.width =
              width;

            canvas.height =
              height;


            const ctx =
              canvas.getContext(
                "2d"
              );


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            canvas.toBlob(
              function(blob) {

                URL.revokeObjectURL(
                  imageURL
                );


                if (!blob) {

                  reject(
                    new Error(
                      "לא ניתן להמיר את התמונה"
                    )
                  );

                  return;
                }


                resolve(blob);

              },

              "image/jpeg",

              0.9
            );

          }

          catch(error) {

            URL.revokeObjectURL(
              imageURL
            );

            reject(error);

          }

        };


      img.onerror =
        function() {

          URL.revokeObjectURL(
            imageURL
          );


          reject(
            new Error(
              "לא ניתן לקרוא את התמונה"
            )
          );

        };


      img.src =
        imageURL;

    }
  );

}


/* ==================================================
   RAILWAY COMPILER
================================================== */

async function compileMarker(
  jpegBlob
) {

  const formData =
    new FormData();


  formData.append(
    "image",
    jpegBlob,
    "marker.jpg"
  );


  const response =
    await fetch(
      COMPILER_URL,
      {
        method: "POST",
        body: formData
      }
    );


  if (!response.ok) {

    let message =
      "Compiler error";


    try {

      const data =
        await response.json();


      if (data.error) {
        message =
          data.error;
      }

    }

    catch {}


    throw new Error(
      "Compiler: "
      +
      message
    );

  }


  const blob =
    await response.blob();


  if (
    !blob ||
    blob.size === 0
  ) {

    throw new Error(
      "ה-Compiler החזיר קובץ ריק"
    );

  }


  return blob;

}


/* ==================================================
   STORAGE UPLOAD
================================================== */

async function uploadFile(
  fileName,
  fileData,
  contentType
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .upload(
        fileName,
        fileData,
        {
          cacheControl:
            "3600",

          upsert:
            false,

          contentType:
            contentType
        }
      );


  if (error) {

    throw new Error(
      "Storage: "
      +
      error.message
    );

  }


  const {
    data: publicUrlData
  } =
    supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .getPublicUrl(
        data.path
      );


  if (
    !publicUrlData ||
    !publicUrlData.publicUrl
  ) {

    throw new Error(
      "לא התקבלה כתובת לקובץ"
    );

  }


  return publicUrlData.publicUrl;

}


/* ==================================================
   CREATE MARKER
================================================== */

compileButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {

      alert(
        "קודם צלם או בחר תמונה"
      );

      return;
    }


    try {

      compileButton.disabled =
        true;

      imageInput.disabled =
        true;

      markerReady =
        false;

      saveStepButton.style.display =
        "none";


      status.className = "";

      status.innerText =
        "מכין את התמונה...";


      const jpegBlob =
        await convertImageToJpeg(
          selectedFile
        );


      status.innerText =
        "יוצר Marker AR בענן...";


      const mindBlob =
        await compileMarker(
          jpegBlob
        );


      const uniqueId =
        Date.now()
        +
        "_"
        +
        Math.random()
          .toString(36)
          .substring(2, 8);


      status.innerText =
        "מעלה תמונת Marker...";


      currentMarkerUrl =
        await uploadFile(

          "marker_"
          +
          uniqueId
          +
          ".jpg",

          jpegBlob,

          "image/jpeg"

        );


      status.innerText =
        "מעלה קובץ AR...";


      currentTargetUrl =
        await uploadFile(

          "target_"
          +
          uniqueId
          +
          ".mind",

          mindBlob,

          "application/octet-stream"

        );


      markerReady =
        true;


      status.className =
        "success";


      status.innerHTML =
        "✅ Marker AR מוכן";


      saveStepButton.style.display =
        "block";

    }

    catch(error) {

      console.error(
        error
      );


      markerReady =
        false;


      status.className =
        "error";


      status.innerText =
        "❌ "
        +
        error.message;


      alert(
        error.message
      );

    }

    finally {

      compileButton.disabled =
        false;

      imageInput.disabled =
        false;

    }

  }
);


/* ==================================================
   CREATE ROUTE
================================================== */

async function createRouteIfNeeded() {

  if (routeId) {
    return routeId;
  }


  const name =
    routeName
      .value
      .trim();


  if (!name) {

    throw new Error(
      "הכנס שם ליעד"
    );

  }


  /*
    The routes table is kept for
    the permanent route ID / URL.

    First step is duplicated here
    for backward compatibility.
  */

  const {
    data,
    error
  } =
    await supabaseClient
      .from("routes")
      .insert({

        name:
          name,

        marker_name:
          markerName.value.trim(),

        direction:
          direction.value,

        instruction:
          instruction.value.trim(),

        marker_url:
          currentMarkerUrl,

        target_url:
          currentTargetUrl

      })
      .select()
      .single();


  if (error) {

    throw new Error(
      "Route: "
      +
      error.message
    );

  }


  routeId =
    data.id;


  routeName.disabled =
    true;


  routeInfo.style.display =
    "block";


  routeInfo.innerHTML =
    "Route ID: <strong>"
    +
    routeId
    +
    "</strong>";


  return routeId;

}


/* ==================================================
   SAVE STEP
================================================== */

saveStepButton.addEventListener(
  "click",
  async function() {

    const pointName =
      markerName
        .value
        .trim();


    const pointInstruction =
      instruction
        .value
        .trim();


    if (!routeName.value.trim()) {

      alert(
        "הכנס שם ליעד"
      );

      return;
    }


    if (!pointName) {

      alert(
        "הכנס שם לנקודה"
      );

      return;
    }


    if (!markerReady) {

      alert(
        "קודם צור Marker AR"
      );

      return;
    }


    try {

      saveStepButton.disabled =
        true;


      saveStatus.className =
        "";


      saveStatus.innerText =
        "שומר נקודה...";


      await createRouteIfNeeded();


      const stepObject = {

        route_id:
          routeId,

        step_order:
          currentStepOrder,

        marker_name:
          pointName,

        marker_url:
          currentMarkerUrl,

        target_url:
          currentTargetUrl,

        direction:
          direction.value,

        instruction:
          pointInstruction

      };


      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "route_steps"
          )
          .insert(
            stepObject
          )
          .select()
          .single();


      if (error) {

        throw new Error(
          "Step: "
          +
          error.message
        );

      }


      savedStepData.push(
        data
      );


      saveStatus.className =
        "success";


      saveStatus.innerText =
        "✅ נקודה "
        +
        currentStepOrder
        +
        " נשמרה";


      renderSavedSteps();


      saveStepButton.style.display =
        "none";


      compileButton.disabled =
        true;


      imageInput.disabled =
        true;


      markerName.disabled =
        true;


      direction.disabled =
        true;


      instruction.disabled =
        true;


      addStepButton.style.display =
        "block";


      finishButton.style.display =
        "block";

    }

    catch(error) {

      console.error(
        error
      );


      saveStatus.className =
        "error";


      saveStatus.innerText =
        "❌ "
        +
        error.message;


      alert(
        error.message
      );

    }

    finally {

      saveStepButton.disabled =
        false;

    }

  }
);


/* ==================================================
   SHOW SAVED STEPS
================================================== */

function renderSavedSteps() {

  savedStepsSection.style.display =
    "block";


  savedSteps.innerHTML =
    "";


  savedStepData.forEach(
    function(step) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "stepRow";


      row.innerHTML =
        "<strong>נקודה "
        +
        step.step_order
        +
        "</strong><br>"
        +
        step.marker_name
        +
        "<br>"
        +
        directionSymbol(
          step.direction
        )
        +
        " "
        +
        (
          step.instruction
          ||
          ""
        );


      savedSteps.appendChild(
        row
      );

    }
  );

}


/* ==================================================
   DIRECTION SYMBOL
================================================== */

function directionSymbol(value) {

  switch(value) {

    case "straight":
      return "⬆️";

    case "left":
      return "⬅️";

    case "right":
      return "➡️";

    case "elevator":
      return "🛗";

    case "stairs":
      return "🪜";

    case "destination":
      return "⭐";

    default:
      return "";
  }

}


/* ==================================================
   ADD NEXT STEP
================================================== */

addStepButton.addEventListener(
  "click",
  function() {

    currentStepOrder++;


    stepTitle.innerText =
      "נקודה "
      +
      currentStepOrder;


    selectedFile =
      null;


    currentMarkerUrl =
      null;


    currentTargetUrl =
      null;


    markerReady =
      false;


    markerName.value =
      "";


    imageInput.value =
      "";


    preview.src =
      "";


    preview.style.display =
      "none";


    direction.value =
      "straight";


    instruction.value =
      "";


    status.className =
      "";


    status.innerText =
      "ממתין לתמונה...";


    saveStatus.innerText =
      "";


    markerName.disabled =
      false;


    imageInput.disabled =
      false;


    direction.disabled =
      false;


    instruction.disabled =
      false;


    compileButton.disabled =
      false;


    saveStepButton.style.display =
      "none";


    addStepButton.style.display =
      "none";


    /*
      Keep Finish visible so
      user can finish at any time.
    */

    window.scrollTo({
      top:
        document.body.scrollHeight,

      behavior:
        "smooth"
    });

  }
);


/* ==================================================
   FINISH ROUTE
================================================== */

finishButton.addEventListener(
  "click",
  function() {

    if (!routeId) {

      alert(
        "עדיין לא נשמרה נקודה"
      );

      return;
    }


    const userUrl =
      "https://ido-last50.github.io/last50/?id="
      +
      routeId;


    finalResult.innerHTML = `

      <div class="section">

        <h3 class="success">
          ✅ המסלול הושלם
        </h3>

        <p>
          נשמרו ${savedStepData.length} נקודות.
        </p>

        <div class="routeBox">

          <strong>
            Route ID:
          </strong>

          ${routeId}

          <br><br>

          <strong>
            User URL:
          </strong>

          <br>

          <a
            href="${userUrl}"
            target="_blank"
          >
            ${userUrl}
          </a>

        </div>

      </div>

    `;


    addStepButton.style.display =
      "none";


    finishButton.style.display =
      "none";


    window.scrollTo({
      top:
        document.body.scrollHeight,

      behavior:
        "smooth"
    });

  }
);

</script>

</body>
</html>
