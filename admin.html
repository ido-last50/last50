<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Last50 Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      direction: rtl;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    h2 {
      text-align: center;
      color: #aaa;
      margin-top: 0;
    }

    .section {
      margin-top: 30px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 15px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border-radius: 8px;
      border: none;
    }

    textarea {
      min-height: 90px;
    }

    button {
      margin-top: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #preview {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-size: 17px;
    }

    #saveButton {
      display: none;
      background: #4CAF50;
      color: white;
    }

    .success {
      color: #66ff80;
    }

    .error {
      color: #ff6666;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Last50</h1>
  <h2>Admin</h2>

  <div class="section">

    <h3>1. יעד</h3>

    <label>שם היעד</label>

    <input
      id="routeName"
      type="text"
      placeholder="לדוגמה: חדר שרתים"
    >

    <label>שם נקודת ההתחלה</label>

    <input
      id="markerName"
      type="text"
      placeholder="לדוגמה: כניסה למשרד"
    >

  </div>


  <div class="section">

    <h3>2. תמונת Marker</h3>

    <p>
      צלם את המקום שממנו הניווט מתחיל.
    </p>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img id="preview">

    <button
      type="button"
      id="markerButton"
    >
      שמור תמונת Marker
    </button>

    <div id="status">
      ממתין לתמונה...
    </div>

  </div>


  <div class="section">

    <h3>3. הוראת ניווט ראשונה</h3>

    <label>כיוון</label>

    <select id="direction">

      <option value="straight">
        ⬆️ ישר
      </option>

      <option value="left">
        ⬅️ שמאלה
      </option>

      <option value="right">
        ➡️ ימינה
      </option>

      <option value="elevator">
        🛗 מעלית
      </option>

      <option value="stairs">
        🪜 מדרגות
      </option>

      <option value="destination">
        ⭐ יעד
      </option>

    </select>

    <label>טקסט שיופיע למשתמש</label>

    <textarea
      id="instruction"
      placeholder="לדוגמה: המשך ישר 10 מטר ואז פנה ימינה"
    ></textarea>

  </div>


  <button
    type="button"
    id="saveButton"
  >
    שמור את הניווט
  </button>

  <div id="saveStatus"></div>

</div>


<script>

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const markerButton =
  document.getElementById("markerButton");

const status =
  document.getElementById("status");

const saveButton =
  document.getElementById("saveButton");

const saveStatus =
  document.getElementById("saveStatus");


let selectedFile = null;

let markerImageData = null;


/* ---------------------------
   בחירת / צילום תמונה
---------------------------- */

imageInput.addEventListener(
  "change",
  function(event) {

    selectedFile =
      event.target.files[0];

    if (!selectedFile) {
      return;
    }

    const imageURL =
      URL.createObjectURL(
        selectedFile
      );

    preview.src =
      imageURL;

    preview.style.display =
      "block";

    status.className = "";

    status.innerText =
      "התמונה מוכנה לשמירה";

  }
);


/* ---------------------------
   שמירת תמונת Marker
---------------------------- */

markerButton.addEventListener(
  "click",
  function() {

    if (!selectedFile) {

      alert(
        "קודם צלם או בחר תמונה"
      );

      return;
    }

    status.className = "";

    status.innerText =
      "שומר תמונת Marker...";


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        markerImageData =
          event.target.result;

        try {

          localStorage.setItem(
            "last50_marker_image",
            markerImageData
          );

          status.className =
            "success";

          status.innerText =
            "✅ תמונת Marker נשמרה";

          saveButton.style.display =
            "block";

        }

        catch(error) {

          console.error(error);

          status.className =
            "error";

          status.innerText =
            "❌ התמונה גדולה מדי לשמירה";

        }

      };


    reader.onerror =
      function() {

        status.className =
          "error";

        status.innerText =
          "❌ שגיאה בקריאת התמונה";

      };


    reader.readAsDataURL(
      selectedFile
    );

  }
);


/* ---------------------------
   שמירת המסלול
---------------------------- */

saveButton.addEventListener(
  "click",
  function() {

    const routeName =
      document
        .getElementById("routeName")
        .value
        .trim();

    const markerName =
      document
        .getElementById("markerName")
        .value
        .trim();

    const direction =
      document
        .getElementById("direction")
        .value;

    const instruction =
      document
        .getElementById("instruction")
        .value
        .trim();


    if (!routeName) {

      alert(
        "הכנס שם ליעד"
      );

      return;

    }


    if (!markerName) {

      alert(
        "הכנס שם לנקודת ההתחלה"
      );

      return;

    }


    if (!markerImageData) {

      alert(
        "קודם שמור תמונת Marker"
      );

      return;

    }


    const route = {

      id:
        Date.now().toString(),

      name:
        routeName,

      markerName:
        markerName,

      markerImage:
        markerImageData,

      direction:
        direction,

      instruction:
        instruction,

      createdAt:
        new Date().toISOString()

    };


    try {

      localStorage.setItem(
        "last50_route",
        JSON.stringify(route)
      );

      saveStatus.innerHTML =
        "<p class='success'>✅ הניווט נשמר</p>";

    }

    catch(error) {

      console.error(error);

      saveStatus.innerHTML =
        "<p class='error'>❌ לא ניתן לשמור את המסלול</p>";

    }

  }
);

</script>

</body>
</html>
