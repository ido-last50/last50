<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Last50 Admin</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      direction: rtl;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    h2 {
      text-align: center;
      color: #aaa;
      margin-top: 0;
    }

    .section {
      margin-top: 30px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 15px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border-radius: 8px;
      border: none;
    }

    textarea {
      min-height: 90px;
    }

    button {
      margin-top: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #preview {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    #status,
    #saveStatus {
      text-align: center;
      margin-top: 15px;
      font-size: 17px;
    }

    #saveButton {
      display: none;
      background: #4CAF50;
      color: white;
    }

    .success {
      color: #66ff80;
    }

    .error {
      color: #ff6666;
    }

    .routeBox {
      margin-top: 20px;
      padding: 15px;
      background: #252525;
      border-radius: 10px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

  </style>
</head>


<body>

<div class="container">

  <h1>Last50</h1>
  <h2>Admin</h2>


  <!-- DESTINATION -->

  <div class="section">

    <h3>1. יעד</h3>

    <label>
      שם היעד
    </label>

    <input
      id="routeName"
      type="text"
      placeholder="לדוגמה: חדר שרתים"
    >


    <label>
      שם נקודת ההתחלה
    </label>

    <input
      id="markerName"
      type="text"
      placeholder="לדוגמה: כניסה למשרד"
    >

  </div>


  <!-- MARKER -->

  <div class="section">

    <h3>
      2. תמונת Marker
    </h3>

    <p>
      צלם את המקום שממנו הניווט מתחיל.
    </p>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img id="preview">

    <button
      type="button"
      id="markerButton"
    >
      אשר תמונת Marker
    </button>

    <div id="status">
      ממתין לתמונה...
    </div>

  </div>


  <!-- NAVIGATION -->

  <div class="section">

    <h3>
      3. הוראת ניווט ראשונה
    </h3>


    <label>
      כיוון
    </label>

    <select id="direction">

      <option value="straight">
        ⬆️ ישר
      </option>

      <option value="left">
        ⬅️ שמאלה
      </option>

      <option value="right">
        ➡️ ימינה
      </option>

      <option value="elevator">
        🛗 מעלית
      </option>

      <option value="stairs">
        🪜 מדרגות
      </option>

      <option value="destination">
        ⭐ יעד
      </option>

    </select>


    <label>
      טקסט שיופיע למשתמש
    </label>

    <textarea
      id="instruction"
      placeholder="לדוגמה: המשך ישר 10 מטר ואז פנה ימינה"
    ></textarea>

  </div>


  <!-- SAVE -->

  <button
    type="button"
    id="saveButton"
  >
    שמור מסלול בענן
  </button>


  <div id="saveStatus"></div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://batvowvhsqyvacigmzyv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eq-i5YF30iQ03ntmqcg_hA_AJy5NJvK";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const markerButton =
  document.getElementById("markerButton");

const status =
  document.getElementById("status");

const saveButton =
  document.getElementById("saveButton");

const saveStatus =
  document.getElementById("saveStatus");


let selectedFile = null;

let markerReady = false;


/* =========================================
   TAKE / SELECT PHOTO
========================================= */

imageInput.addEventListener(
  "change",
  function(event) {

    selectedFile =
      event.target.files[0];

    markerReady = false;

    saveButton.style.display =
      "none";

    if (!selectedFile) {
      return;
    }


    const imageURL =
      URL.createObjectURL(
        selectedFile
      );


    preview.src =
      imageURL;

    preview.style.display =
      "block";


    status.className = "";

    status.innerText =
      "התמונה מוכנה";

  }
);


/* =========================================
   CONFIRM MARKER
========================================= */

markerButton.addEventListener(
  "click",
  function() {

    if (!selectedFile) {

      alert(
        "קודם צלם או בחר תמונה"
      );

      return;
    }


    markerReady = true;


    status.className =
      "success";


    status.innerText =
      "✅ תמונת Marker מוכנה";


    saveButton.style.display =
      "block";

  }
);


/* =========================================
   FILE EXTENSION
========================================= */

function getFileExtension(file) {

  if (
    file.name &&
    file.name.includes(".")
  ) {

    return file.name
      .split(".")
      .pop()
      .toLowerCase();

  }


  if (
    file.type === "image/png"
  ) {

    return "png";

  }


  if (
    file.type === "image/heic"
  ) {

    return "heic";

  }


  return "jpg";

}


/* =========================================
   SAVE ROUTE TO SUPABASE
========================================= */

saveButton.addEventListener(
  "click",
  async function() {


    const routeName =
      document
        .getElementById("routeName")
        .value
        .trim();


    const markerName =
      document
        .getElementById("markerName")
        .value
        .trim();


    const direction =
      document
        .getElementById("direction")
        .value;


    const instruction =
      document
        .getElementById("instruction")
        .value
        .trim();


    /* VALIDATION */

    if (!routeName) {

      alert(
        "הכנס שם ליעד"
      );

      return;
    }


    if (!markerName) {

      alert(
        "הכנס שם לנקודת ההתחלה"
      );

      return;
    }


    if (!markerReady) {

      alert(
        "קודם אשר את תמונת ה-Marker"
      );

      return;
    }


    try {


      saveButton.disabled =
        true;


      saveStatus.className = "";


      saveStatus.innerText =
        "מעלה את תמונת ה-Marker...";


      /* ==========================
         UNIQUE FILE NAME
      ========================== */


      const extension =
        getFileExtension(
          selectedFile
        );


      const fileName =
        "marker_"
        +
        Date.now()
        +
        "_"
        +
        Math.random()
          .toString(36)
          .substring(2, 8)
        +
        "."
        +
        extension;


      /* ==========================
         UPLOAD IMAGE
      ========================== */


      const {
        data: uploadData,
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("markers")
          .upload(
            fileName,
            selectedFile,
            {
              cacheControl: "3600",
              upsert: false,
              contentType:
                selectedFile.type
                ||
                "image/jpeg"
            }
          );


      if (uploadError) {

        throw new Error(
          "Storage: "
          +
          uploadError.message
        );

      }


      /* ==========================
         GET PUBLIC URL
      ========================== */


      const {
        data: publicUrlData
      } =
        supabaseClient
          .storage
          .from("markers")
          .getPublicUrl(
            uploadData.path
          );


      const markerUrl =
        publicUrlData.publicUrl;


      if (!markerUrl) {

        throw new Error(
          "לא התקבלה כתובת לתמונה"
        );

      }


      saveStatus.innerText =
        "שומר את המסלול...";


      /* ==========================
         INSERT ROUTE
      ========================== */


      const {
        data: routeData,
        error: routeError
      } =
        await supabaseClient
          .from("routes")
          .insert({

            name:
              routeName,

            marker_name:
              markerName,

            direction:
              direction,

            instruction:
              instruction,

            marker_url:
              markerUrl

          })
          .select()
          .single();


      if (routeError) {

        throw new Error(
          "Database: "
          +
          routeError.message
        );

      }


      /* ==========================
         SUCCESS
      ========================== */


      const routeId =
        routeData.id;


      const userUrl =
        "https://ido-last50.github.io/last50/?id="
        +
        routeId;


      saveStatus.className =
        "success";


      saveStatus.innerHTML = `

        <p>
          ✅ המסלול נשמר בענן
        </p>

        <div class="routeBox">

          <strong>
            Route ID:
          </strong>

          ${routeId}

          <br><br>

          <strong>
            User URL:
          </strong>

          <br>

          ${userUrl}

        </div>

      `;


      console.log(
        "Saved route:",
        routeData
      );


    }

    catch(error) {


      console.error(
        error
      );


      saveStatus.className =
        "error";


      saveStatus.innerText =
        "❌ "
        +
        error.message;


      alert(
        error.message
      );

    }

    finally {


      saveButton.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
