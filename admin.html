<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Last50 Admin</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      direction: rtl;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    h2 {
      text-align: center;
      color: #aaa;
      margin-top: 0;
    }

    .section {
      margin-top: 30px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 15px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border-radius: 8px;
      border: none;
    }

    textarea {
      min-height: 90px;
    }

    button {
      margin-top: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      opacity: 0.5;
    }

    #preview {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    #status,
    #saveStatus {
      text-align: center;
      margin-top: 15px;
      font-size: 17px;
      line-height: 1.5;
    }

    #markerButton {
      background: #2196F3;
      color: white;
    }

    #saveButton {
      display: none;
      background: #4CAF50;
      color: white;
    }

    .success {
      color: #66ff80;
    }

    .error {
      color: #ff6666;
    }

    .routeBox {
      margin-top: 20px;
      padding: 15px;
      background: #252525;
      border-radius: 10px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .routeBox a {
      color: #66ff80;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Last50</h1>
  <h2>Admin</h2>


  <!-- DESTINATION -->

  <div class="section">

    <h3>1. יעד</h3>

    <label>
      שם היעד
    </label>

    <input
      id="routeName"
      type="text"
      placeholder="לדוגמה: חדר שרתים"
    >


    <label>
      שם נקודת ההתחלה
    </label>

    <input
      id="markerName"
      type="text"
      placeholder="לדוגמה: כניסה למשרד"
    >

  </div>


  <!-- MARKER -->

  <div class="section">

    <h3>
      2. תמונת Marker
    </h3>

    <p>
      צלם את המקום שממנו הניווט מתחיל.
    </p>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img id="preview">

    <button
      type="button"
      id="markerButton"
    >
      צור Marker AR
    </button>

    <div id="status">
      ממתין לתמונה...
    </div>

  </div>


  <!-- NAVIGATION -->

  <div class="section">

    <h3>
      3. הוראת ניווט ראשונה
    </h3>

    <label>
      כיוון
    </label>

    <select id="direction">

      <option value="straight">
        ⬆️ ישר
      </option>

      <option value="left">
        ⬅️ שמאלה
      </option>

      <option value="right">
        ➡️ ימינה
      </option>

      <option value="elevator">
        🛗 מעלית
      </option>

      <option value="stairs">
        🪜 מדרגות
      </option>

      <option value="destination">
        ⭐ יעד
      </option>

    </select>


    <label>
      טקסט שיופיע למשתמש
    </label>

    <textarea
      id="instruction"
      placeholder="לדוגמה: המשך ישר 10 מטר ואז פנה ימינה"
    ></textarea>

  </div>


  <!-- SAVE -->

  <button
    type="button"
    id="saveButton"
  >
    שמור מסלול בענן
  </button>

  <div id="saveStatus"></div>

</div>


<script>

/* =========================================
   CONFIG
========================================= */

const SUPABASE_URL =
  "https://batvowvhsqyvacigmzyv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eq-i5YF30iQ03ntmqcg_hA_AJy5NJvK";

const COMPILER_URL =
  "https://last50-compiler-production.up.railway.app/compile";

const STORAGE_BUCKET =
  "markers";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const markerButton =
  document.getElementById("markerButton");

const status =
  document.getElementById("status");

const saveButton =
  document.getElementById("saveButton");

const saveStatus =
  document.getElementById("saveStatus");


let selectedFile = null;

let markerReady = false;

let markerUrl = null;

let targetUrl = null;


/* =========================================
   SELECT PHOTO
========================================= */

imageInput.addEventListener(
  "change",
  function(event) {

    selectedFile =
      event.target.files[0];

    markerReady = false;

    markerUrl = null;

    targetUrl = null;

    saveButton.style.display =
      "none";

    saveStatus.innerHTML = "";

    if (!selectedFile) {

      preview.style.display =
        "none";

      status.className = "";

      status.innerText =
        "ממתין לתמונה...";

      return;
    }


    const imageURL =
      URL.createObjectURL(
        selectedFile
      );


    preview.src =
      imageURL;

    preview.style.display =
      "block";


    status.className = "";

    status.innerText =
      "התמונה מוכנה. לחץ על צור Marker AR.";

  }
);


/* =========================================
   CONVERT IMAGE TO JPEG
========================================= */

function convertImageToJpeg(file) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      const imageURL =
        URL.createObjectURL(file);


      img.onload =
        function() {

          try {

            const MAX_SIZE =
              1600;

            let width =
              img.naturalWidth;

            let height =
              img.naturalHeight;


            if (
              width > MAX_SIZE ||
              height > MAX_SIZE
            ) {

              const scale =
                Math.min(
                  MAX_SIZE / width,
                  MAX_SIZE / height
                );

              width =
                Math.round(
                  width * scale
                );

              height =
                Math.round(
                  height * scale
                );

            }


            const canvas =
              document.createElement(
                "canvas"
              );

            canvas.width =
              width;

            canvas.height =
              height;


            const ctx =
              canvas.getContext(
                "2d"
              );


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            canvas.toBlob(
              function(blob) {

                URL.revokeObjectURL(
                  imageURL
                );

                if (!blob) {

                  reject(
                    new Error(
                      "לא ניתן להמיר את התמונה ל-JPEG"
                    )
                  );

                  return;
                }

                resolve(blob);

              },

              "image/jpeg",

              0.9
            );

          }

          catch(error) {

            URL.revokeObjectURL(
              imageURL
            );

            reject(error);

          }

        };


      img.onerror =
        function() {

          URL.revokeObjectURL(
            imageURL
          );

          reject(
            new Error(
              "לא ניתן לקרוא את התמונה"
            )
          );

        };


      img.src =
        imageURL;

    }
  );

}


/* =========================================
   SEND IMAGE TO RAILWAY COMPILER
========================================= */

async function compileMarker(
  jpegBlob
) {

  const formData =
    new FormData();


  formData.append(
    "image",
    jpegBlob,
    "marker.jpg"
  );


  const response =
    await fetch(
      COMPILER_URL,
      {
        method: "POST",
        body: formData
      }
    );


  if (!response.ok) {

    let message =
      "Compiler error";

    try {

      const data =
        await response.json();

      if (data.error) {
        message =
          data.error;
      }

    }

    catch {

      try {
        message =
          await response.text();
      }
      catch {}
    }


    throw new Error(
      "Compiler: "
      +
      message
    );

  }


  const mindBlob =
    await response.blob();


  if (
    !mindBlob ||
    mindBlob.size === 0
  ) {

    throw new Error(
      "ה-Compiler החזיר קובץ ריק"
    );

  }


  return mindBlob;

}


/* =========================================
   UPLOAD FILE TO SUPABASE
========================================= */

async function uploadFile(
  fileName,
  fileData,
  contentType
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .upload(
        fileName,
        fileData,
        {
          cacheControl:
            "3600",

          upsert:
            false,

          contentType:
            contentType
        }
      );


  if (error) {

    throw new Error(
      "Storage: "
      +
      error.message
    );

  }


  const {
    data: publicUrlData
  } =
    supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .getPublicUrl(
        data.path
      );


  if (
    !publicUrlData ||
    !publicUrlData.publicUrl
  ) {

    throw new Error(
      "לא התקבלה כתובת לקובץ"
    );

  }


  return publicUrlData.publicUrl;

}


/* =========================================
   CREATE AR MARKER
========================================= */

markerButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {

      alert(
        "קודם צלם או בחר תמונה"
      );

      return;
    }


    try {

      markerButton.disabled =
        true;

      imageInput.disabled =
        true;

      saveButton.style.display =
        "none";

      markerReady =
        false;

      markerUrl =
        null;

      targetUrl =
        null;


      status.className = "";

      status.innerText =
        "מכין את התמונה...";


      /*
        Convert iPhone image / HEIC
        to standard JPEG
      */

      const jpegBlob =
        await convertImageToJpeg(
          selectedFile
        );


      /*
        Railway:
        JPG -> .mind
      */

      status.innerText =
        "יוצר Marker AR בענן... זה יכול לקחת כחצי דקה עד דקה.";


      const mindBlob =
        await compileMarker(
          jpegBlob
        );


      /*
        Unique filename
      */

      const uniqueId =
        Date.now()
        +
        "_"
        +
        Math.random()
          .toString(36)
          .substring(2, 8);


      const markerFileName =
        "marker_"
        +
        uniqueId
        +
        ".jpg";


      const targetFileName =
        "target_"
        +
        uniqueId
        +
        ".mind";


      /*
        Upload original marker image
      */

      status.innerText =
        "מעלה את תמונת ה-Marker לענן...";


      markerUrl =
        await uploadFile(
          markerFileName,
          jpegBlob,
          "image/jpeg"
        );


      /*
        Upload .mind
      */

      status.innerText =
        "מעלה את קובץ ה-AR לענן...";


      targetUrl =
        await uploadFile(
          targetFileName,
          mindBlob,
          "application/octet-stream"
        );


      markerReady =
        true;


      status.className =
        "success";


      status.innerHTML =
        "✅ Marker AR מוכן<br>התמונה וקובץ ה-.mind נשמרו בענן";


      saveButton.style.display =
        "block";

    }

    catch(error) {

      console.error(
        error
      );


      markerReady =
        false;

      markerUrl =
        null;

      targetUrl =
        null;


      status.className =
        "error";


      status.innerText =
        "❌ "
        +
        error.message;


      alert(
        error.message
      );

    }

    finally {

      markerButton.disabled =
        false;

      imageInput.disabled =
        false;

    }

  }
);


/* =========================================
   SAVE ROUTE TO SUPABASE
========================================= */

saveButton.addEventListener(
  "click",
  async function() {


    const routeName =
      document
        .getElementById(
          "routeName"
        )
        .value
        .trim();


    const markerName =
      document
        .getElementById(
          "markerName"
        )
        .value
        .trim();


    const direction =
      document
        .getElementById(
          "direction"
        )
        .value;


    const instruction =
      document
        .getElementById(
          "instruction"
        )
        .value
        .trim();


    /* VALIDATION */

    if (!routeName) {

      alert(
        "הכנס שם ליעד"
      );

      return;
    }


    if (!markerName) {

      alert(
        "הכנס שם לנקודת ההתחלה"
      );

      return;
    }


    if (
      !markerReady ||
      !markerUrl ||
      !targetUrl
    ) {

      alert(
        "קודם צור Marker AR"
      );

      return;
    }


    try {

      saveButton.disabled =
        true;


      saveStatus.className =
        "";


      saveStatus.innerText =
        "שומר את המסלול ב-Supabase...";


      /*
        INSERT ROUTE
      */

      const {
        data: routeData,
        error: routeError
      } =
        await supabaseClient
          .from(
            "routes"
          )
          .insert({

            name:
              routeName,

            marker_name:
              markerName,

            direction:
              direction,

            instruction:
              instruction,

            marker_url:
              markerUrl,

            target_url:
              targetUrl

          })
          .select()
          .single();


      if (routeError) {

        throw new Error(
          "Database: "
          +
          routeError.message
        );

      }


      const routeId =
        routeData.id;


      const userUrl =
        "https://ido-last50.github.io/last50/?id="
        +
        routeId;


      saveStatus.className =
        "success";


      saveStatus.innerHTML = `

        <p>
          ✅ המסלול נשמר בענן
        </p>

        <div class="routeBox">

          <strong>
            Route ID:
          </strong>

          ${routeId}

          <br><br>

          <strong>
            User URL:
          </strong>

          <br>

          <a
            href="${userUrl}"
            target="_blank"
          >
            ${userUrl}
          </a>

          <br><br>

          <strong>
            Marker:
          </strong>

          <br>

          ${markerUrl}

          <br><br>

          <strong>
            AR Target:
          </strong>

          <br>

          ${targetUrl}

        </div>

      `;


      console.log(
        "Saved route:",
        routeData
      );

    }

    catch(error) {

      console.error(
        error
      );


      saveStatus.className =
        "error";


      saveStatus.innerText =
        "❌ "
        +
        error.message;


      alert(
        error.message
      );

    }

    finally {

      saveButton.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
