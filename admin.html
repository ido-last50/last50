<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Last50 Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 22px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      direction: rtl;
    }

    .container {
      max-width: 540px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    h2 {
      text-align: center;
      color: #aaa;
      margin-top: 0;
    }

    .section {
      margin-top: 22px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 16px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: none;
      border-radius: 9px;
    }

    textarea {
      min-height: 90px;
    }

    button {
      margin-top: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #loadRouteButton {
      background: #673ab7;
      color: white;
    }

    #compileButton {
      background: #2196f3;
      color: white;
    }

    #saveStepButton {
      display: none;
      background: #4caf50;
      color: white;
    }

    #newStepButton {
      display: none;
      background: #ff9800;
      color: white;
    }

    #finishButton {
      display: none;
      background: #9c27b0;
      color: white;
    }

    #preview {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    .success {
      color: #66ff80;
    }

    .error {
      color: #ff6666;
    }

    #status,
    #saveStatus {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .stepItem {
      margin-top: 10px;
      padding: 14px;
      background: #292929;
      border-radius: 10px;
    }

    .stepItem button {
      background: #444;
      color: white;
      margin-top: 8px;
    }

    .routeBox {
      margin-top: 18px;
      padding: 15px;
      background: #252525;
      border-radius: 12px;
      direction: ltr;
      text-align: left;
      word-break: break-all;
    }

    .routeBox a {
      color: #66ff80;
    }

    .small {
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Last50</h1>
  <h2>Route Admin</h2>


  <div class="section">

    <h3>מסלול</h3>

    <label>
      Route ID קיים — אופציונלי
    </label>

    <input
      id="existingRouteId"
      type="number"
      placeholder="לדוגמה: 12"
    >

    <button
      id="loadRouteButton"
      type="button"
    >
      טען מסלול קיים
    </button>

    <label>
      שם היעד
    </label>

    <input
      id="routeName"
      type="text"
      placeholder="לדוגמה: חדר שרתים"
    >

    <div
      id="routeStatus"
      class="small"
      style="margin-top:12px;"
    ></div>

  </div>


  <div
    id="stepsListSection"
    class="section"
    style="display:none;"
  >

    <h3>נקודות במסלול</h3>

    <div id="stepsList"></div>

  </div>


  <div class="section">

    <h3 id="stepTitle">
      נקודה חדשה
    </h3>

    <label>
      מספר נקודה
    </label>

    <input
      id="stepOrder"
      type="number"
      min="1"
      value="1"
    >

    <label>
      שם הנקודה
    </label>

    <input
      id="markerName"
      type="text"
      placeholder="לדוגמה: מסדרון"
    >

    <label>
      תמונת Marker
    </label>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img
      id="preview"
      alt="Marker"
    >

    <button
      id="compileButton"
      type="button"
    >
      צור Marker AR
    </button>

    <div id="status">
      ממתין לתמונה...
    </div>


    <label>
      כיוון
    </label>

    <select id="direction">

      <option value="straight">
        ⬆️ ישר
      </option>

      <option value="left">
        ⬅️ שמאלה
      </option>

      <option value="right">
        ➡️ ימינה
      </option>

      <option value="elevator">
        🛗 מעלית
      </option>

      <option value="stairs">
        🪜 מדרגות
      </option>

      <option value="destination">
        ⭐ יעד
      </option>

    </select>


    <label>
      הוראת ניווט
    </label>

    <textarea
      id="instruction"
      placeholder="לדוגמה: פנה שמאלה והמשך 10 מטר"
    ></textarea>


    <button
      id="saveStepButton"
      type="button"
    >
      שמור נקודה
    </button>

  </div>


  <div id="saveStatus"></div>


  <button
    id="newStepButton"
    type="button"
  >
    ➕ הוסף נקודה חדשה
  </button>


  <button
    id="finishButton"
    type="button"
  >
    ✅ סיים מסלול
  </button>


  <div id="finalResult"></div>

</div>


<script>

/* ======================================
   CONFIG
====================================== */

const SUPABASE_URL =
  "https://batvowvhsqyvacigmzyv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eq-i5YF30iQ03ntmqcg_hA_AJy5NJvK";

const COMPILER_URL =
  "https://last50-compiler-production.up.railway.app/compile";

const STORAGE_BUCKET =
  "markers";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ======================================
   ELEMENTS
====================================== */

const existingRouteId =
  document.getElementById("existingRouteId");

const loadRouteButton =
  document.getElementById("loadRouteButton");

const routeName =
  document.getElementById("routeName");

const routeStatus =
  document.getElementById("routeStatus");

const stepsListSection =
  document.getElementById("stepsListSection");

const stepsList =
  document.getElementById("stepsList");

const stepTitle =
  document.getElementById("stepTitle");

const stepOrder =
  document.getElementById("stepOrder");

const markerName =
  document.getElementById("markerName");

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const compileButton =
  document.getElementById("compileButton");

const status =
  document.getElementById("status");

const direction =
  document.getElementById("direction");

const instruction =
  document.getElementById("instruction");

const saveStepButton =
  document.getElementById("saveStepButton");

const saveStatus =
  document.getElementById("saveStatus");

const newStepButton =
  document.getElementById("newStepButton");

const finishButton =
  document.getElementById("finishButton");

const finalResult =
  document.getElementById("finalResult");


/* ======================================
   STATE
====================================== */

let routeId = null;

let routeData = null;

let routeSteps = [];

let editingStepId = null;

let selectedFile = null;

let markerReady = false;

let currentMarkerUrl = null;

let currentTargetUrl = null;


/* ======================================
   IMAGE
====================================== */

imageInput.addEventListener(
  "change",
  function(event) {

    selectedFile =
      event.target.files[0];

    markerReady = false;

    currentMarkerUrl = null;

    currentTargetUrl = null;

    saveStepButton.style.display =
      "none";


    if (!selectedFile) {

      preview.style.display =
        "none";

      return;
    }


    const url =
      URL.createObjectURL(
        selectedFile
      );


    preview.src = url;

    preview.style.display =
      "block";


    status.className = "";

    status.innerText =
      "התמונה מוכנה. לחץ צור Marker AR.";

  }
);


/* ======================================
   JPEG
====================================== */

function convertImageToJpeg(file) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      const url =
        URL.createObjectURL(
          file
        );


      img.onload =
        function() {

          try {

            const MAX_SIZE =
              1600;

            let width =
              img.naturalWidth;

            let height =
              img.naturalHeight;


            if (
              width > MAX_SIZE ||
              height > MAX_SIZE
            ) {

              const scale =
                Math.min(
                  MAX_SIZE / width,
                  MAX_SIZE / height
                );

              width =
                Math.round(
                  width * scale
                );

              height =
                Math.round(
                  height * scale
                );

            }


            const canvas =
              document.createElement(
                "canvas"
              );


            canvas.width =
              width;

            canvas.height =
              height;


            const ctx =
              canvas.getContext(
                "2d"
              );


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            canvas.toBlob(
              function(blob) {

                URL.revokeObjectURL(
                  url
                );


                if (!blob) {

                  reject(
                    new Error(
                      "לא ניתן להמיר את התמונה"
                    )
                  );

                  return;
                }


                resolve(blob);

              },

              "image/jpeg",

              0.9
            );

          }

          catch(error) {

            reject(error);

          }

        };


      img.onerror =
        function() {

          reject(
            new Error(
              "לא ניתן לקרוא תמונה"
            )
          );

        };


      img.src =
        url;

    }
  );

}


/* ======================================
   COMPILER
====================================== */

async function compileMarker(
  jpegBlob
) {

  const formData =
    new FormData();


  formData.append(
    "image",
    jpegBlob,
    "marker.jpg"
  );


  const response =
    await fetch(
      COMPILER_URL,
      {
        method: "POST",
        body: formData
      }
    );


  if (!response.ok) {

    let message =
      "Compiler error";


    try {

      const data =
        await response.json();


      if (data.error) {
        message =
          data.error;
      }

    }

    catch {}


    throw new Error(
      message
    );

  }


  const blob =
    await response.blob();


  if (
    !blob ||
    blob.size === 0
  ) {

    throw new Error(
      "קובץ .mind ריק"
    );

  }


  return blob;

}


/* ======================================
   STORAGE
====================================== */

async function uploadFile(
  name,
  file,
  contentType
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .upload(
        name,
        file,
        {
          cacheControl:
            "3600",

          upsert:
            false,

          contentType:
            contentType
        }
      );


  if (error) {

    throw new Error(
      "Storage: "
      +
      error.message
    );

  }


  const {
    data: publicData
  } =
    supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .getPublicUrl(
        data.path
      );


  return publicData.publicUrl;

}


/* ======================================
   COMPILE BUTTON
====================================== */

compileButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {

      alert(
        "קודם צלם או בחר תמונה"
      );

      return;
    }


    try {

      compileButton.disabled =
        true;

      imageInput.disabled =
        true;

      markerReady =
        false;


      status.className = "";

      status.innerText =
        "מכין תמונה...";


      const jpegBlob =
        await convertImageToJpeg(
          selectedFile
        );


      status.innerText =
        "יוצר קובץ AR ב-Railway...";


      const mindBlob =
        await compileMarker(
          jpegBlob
        );


      const unique =
        Date.now()
        +
        "_"
        +
        Math.random()
          .toString(36)
          .substring(2, 8);


      status.innerText =
        "מעלה Marker ל-Supabase...";


      currentMarkerUrl =
        await uploadFile(

          "marker_"
          +
          unique
          +
          ".jpg",

          jpegBlob,

          "image/jpeg"

        );


      status.innerText =
        "מעלה target.mind...";


      currentTargetUrl =
        await uploadFile(

          "target_"
          +
          unique
          +
          ".mind",

          mindBlob,

          "application/octet-stream"

        );


      markerReady =
        true;


      status.className =
        "success";


      status.innerText =
        "✅ Marker AR מוכן";


      saveStepButton.style.display =
        "block";

    }

    catch(error) {

      console.error(error);


      status.className =
        "error";


      status.innerText =
        "❌ "
        +
        error.message;


      alert(
        error.message
      );

    }

    finally {

      compileButton.disabled =
        false;

      imageInput.disabled =
        false;

    }

  }
);


/* ======================================
   LOAD EXISTING ROUTE
====================================== */

loadRouteButton.addEventListener(
  "click",
  async function() {

    const id =
      existingRouteId.value.trim();


    if (!id) {

      alert(
        "הכנס Route ID"
      );

      return;
    }


    try {

      routeStatus.innerText =
        "טוען מסלול...";


      const {
        data: route,
        error: routeError
      } =
        await supabaseClient
          .from("routes")
          .select("*")
          .eq("id", id)
          .single();


      if (routeError) {
        throw routeError;
      }


      const {
        data: steps,
        error: stepError
      } =
        await supabaseClient
          .from("route_steps")
          .select("*")
          .eq("route_id", id)
          .order(
            "step_order",
            {
              ascending: true
            }
          );


      if (stepError) {
        throw stepError;
      }


      routeId =
        route.id;


      routeData =
        route;


      routeSteps =
        steps || [];


      routeName.value =
        route.name || "";


      routeName.disabled =
        true;


      routeStatus.className =
        "success";


      routeStatus.innerText =
        "✅ Route "
        +
        routeId
        +
        " נטען";


      renderSteps();


      prepareNewStep();

    }

    catch(error) {

      console.error(error);


      routeStatus.className =
        "error";


      routeStatus.innerText =
        "❌ "
        +
        error.message;

    }

  }
);


/* ======================================
   CREATE NEW ROUTE
====================================== */

async function createRouteIfNeeded() {

  if (routeId) {
    return routeId;
  }


  const name =
    routeName.value.trim();


  if (!name) {

    throw new Error(
      "הכנס שם יעד"
    );

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("routes")
      .insert({

        name:
          name,

        marker_name:
          markerName.value.trim(),

        marker_url:
          currentMarkerUrl,

        target_url:
          currentTargetUrl,

        direction:
          direction.value,

        instruction:
          instruction.value.trim()

      })
      .select()
      .single();


  if (error) {

    throw new Error(
      "Route: "
      +
      error.message
    );

  }


  routeId =
    data.id;


  routeData =
    data;


  routeName.disabled =
    true;


  existingRouteId.value =
    routeId;


  routeStatus.className =
    "success";


  routeStatus.innerText =
    "✅ נוצר Route "
    +
    routeId;


  return routeId;

}


/* ======================================
   SAVE / UPDATE STEP
====================================== */

saveStepButton.addEventListener(
  "click",
  async function() {

    if (!markerReady) {

      alert(
        "קודם צור Marker AR"
      );

      return;
    }


    if (!markerName.value.trim()) {

      alert(
        "הכנס שם נקודה"
      );

      return;
    }


    try {

      saveStepButton.disabled =
        true;


      saveStatus.className = "";


      saveStatus.innerText =
        "שומר נקודה...";


      await createRouteIfNeeded();


      const payload = {

        route_id:
          routeId,

        step_order:
          parseInt(
            stepOrder.value,
            10
          ),

        marker_name:
          markerName.value.trim(),

        marker_url:
          currentMarkerUrl,

        target_url:
          currentTargetUrl,

        direction:
          direction.value,

        instruction:
          instruction.value.trim()

      };


      let result;


      if (editingStepId) {

        result =
          await supabaseClient
            .from("route_steps")
            .update(
              payload
            )
            .eq(
              "id",
              editingStepId
            )
            .select()
            .single();

      }

      else {

        result =
          await supabaseClient
            .from("route_steps")
            .insert(
              payload
            )
            .select()
            .single();

      }


      if (result.error) {

        throw new Error(
          "Step: "
          +
          result.error.message
        );

      }


      saveStatus.className =
        "success";


      saveStatus.innerText =
        editingStepId
        ?
        "✅ הנקודה עודכנה"
        :
        "✅ הנקודה נשמרה";


      await reloadSteps();


      prepareNewStep();


      newStepButton.style.display =
        "block";


      finishButton.style.display =
        "block";

    }

    catch(error) {

      console.error(error);


      saveStatus.className =
        "error";


      saveStatus.innerText =
        "❌ "
        +
        error.message;


      alert(
        error.message
      );

    }

    finally {

      saveStepButton.disabled =
        false;

    }

  }
);


/* ======================================
   RELOAD STEPS
====================================== */

async function reloadSteps() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("route_steps")
      .select("*")
      .eq(
        "route_id",
        routeId
      )
      .order(
        "step_order",
        {
          ascending: true
        }
      );


  if (error) {
    throw error;
  }


  routeSteps =
    data || [];


  renderSteps();

}


/* ======================================
   RENDER STEPS
====================================== */

function renderSteps() {

  stepsListSection.style.display =
    "block";


  stepsList.innerHTML =
    "";


  if (
    routeSteps.length === 0
  ) {

    stepsList.innerHTML =
      "<div class='small'>אין עדיין נקודות</div>";

    return;
  }


  routeSteps.forEach(
    function(step) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "stepItem";


      const hasTarget =
        !!step.target_url;


      div.innerHTML = `

        <strong>
          נקודה ${step.step_order}
        </strong>

        <br>

        ${step.marker_name || ""}

        <br>

        ${
          hasTarget
          ?
          "✅ AR מוכן"
          :
          "❌ חסר AR"
        }

      `;


      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.innerText =
        hasTarget
        ?
        "ערוך Marker"
        :
        "צור Marker לנקודה";


      button.onclick =
        function() {

          editStep(step);

        };


      div.appendChild(
        button
      );


      stepsList.appendChild(
        div
      );

    }
  );

}


/* ======================================
   EDIT EXISTING STEP
====================================== */

function editStep(step) {

  editingStepId =
    step.id;


  stepTitle.innerText =
    "עריכת נקודה "
    +
    step.step_order;


  stepOrder.value =
    step.step_order;


  markerName.value =
    step.marker_name || "";


  direction.value =
    step.direction || "straight";


  instruction.value =
    step.instruction || "";


  currentMarkerUrl =
    step.marker_url || null;


  currentTargetUrl =
    step.target_url || null;


  markerReady =
    !!step.target_url;


  selectedFile =
    null;


  imageInput.value =
    "";


  if (step.marker_url) {

    preview.src =
      step.marker_url;


    preview.style.display =
      "block";

  }

  else {

    preview.style.display =
      "none";

  }


  status.className =
    step.target_url
    ?
    "success"
    :
    "";


  status.innerText =
    step.target_url
    ?
    "✅ לנקודה כבר יש Marker AR. אפשר לצלם חדש כדי להחליף."
    :
    "בחר/צלם תמונה ואז צור Marker AR.";


  /*
    If target already exists,
    allow saving current metadata.

    If target is missing,
    user must compile first.
  */

  saveStepButton.style.display =
    step.target_url
    ?
    "block"
    :
    "none";


  window.scrollTo({
    top:
      document.body.scrollHeight,

    behavior:
      "smooth"
  });

}


/* ======================================
   NEW STEP
====================================== */

function prepareNewStep() {

  editingStepId =
    null;


  const nextOrder =
    routeSteps.length
    ?
    Math.max(
      ...routeSteps.map(
        s => s.step_order || 0
      )
    ) + 1
    :
    1;


  stepTitle.innerText =
    "נקודה חדשה";


  stepOrder.value =
    nextOrder;


  markerName.value =
    "";


  imageInput.value =
    "";


  preview.src =
    "";


  preview.style.display =
    "none";


  direction.value =
    "straight";


  instruction.value =
    "";


  selectedFile =
    null;


  markerReady =
    false;


  currentMarkerUrl =
    null;


  currentTargetUrl =
    null;


  status.className =
    "";


  status.innerText =
    "ממתין לתמונה...";


  saveStepButton.style.display =
    "none";

}


/* ======================================
   NEW STEP BUTTON
====================================== */

newStepButton.addEventListener(
  "click",
  function() {

    prepareNewStep();

  }
);


/* ======================================
   FINISH
====================================== */

finishButton.addEventListener(
  "click",
  function() {

    if (!routeId) {

      alert(
        "אין Route"
      );

      return;
    }


    const url =
      "https://ido-last50.github.io/last50/?id="
      +
      routeId;


    finalResult.innerHTML = `

      <div class="section">

        <h3 class="success">
          ✅ המסלול מוכן
        </h3>

        <div class="routeBox">

          Route ID:
          ${routeId}

          <br><br>

          <a
            href="${url}"
            target="_blank"
          >
            ${url}
          </a>

        </div>

      </div>

    `;

  }
);


/* ======================================
   AUTO LOAD ?id=
====================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const autoId =
  params.get("id");


if (autoId) {

  existingRouteId.value =
    autoId;


  setTimeout(
    () =>
      loadRouteButton.click(),
    100
  );

}

</script>
