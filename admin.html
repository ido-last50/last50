<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Last50 Admin</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      direction: rtl;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    h2 {
      text-align: center;
      color: #aaa;
      margin-top: 0;
    }

    .section {
      margin-top: 30px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 15px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border-radius: 8px;
      border: none;
    }

    textarea {
      min-height: 90px;
    }

    button {
      margin-top: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #preview {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-size: 17px;
    }

    #saveButton {
      display: none;
      background: #4CAF50;
      color: white;
    }

    .success {
      color: #66ff80;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Last50</h1>
  <h2>Admin</h2>


  <div class="section">

    <h3>1. יעד</h3>

    <label>שם היעד</label>

    <input
      id="routeName"
      type="text"
      placeholder="לדוגמה: חדר שרתים"
    >

    <label>שם נקודת ההתחלה</label>

    <input
      id="markerName"
      type="text"
      placeholder="לדוגמה: כניסה למשרד"
    >

  </div>


  <div class="section">

    <h3>2. Marker</h3>

    <p>
      צלם את המקום שממנו הניווט מתחיל.
    </p>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img id="preview">

    <button id="compileButton">
      צור Marker
    </button>

    <div id="status">
      ממתין לתמונה...
    </div>

  </div>


  <div class="section">

    <h3>3. הוראת ניווט ראשונה</h3>

    <label>כיוון</label>

    <select id="direction">

      <option value="straight">
        ⬆️ ישר
      </option>

      <option value="left">
        ⬅️ שמאלה
      </option>

      <option value="right">
        ➡️ ימינה
      </option>

      <option value="elevator">
        🛗 מעלית
      </option>

      <option value="stairs">
        🪜 מדרגות
      </option>

      <option value="destination">
        ⭐ יעד
      </option>

    </select>


    <label>טקסט שיופיע למשתמש</label>

    <textarea
      id="instruction"
      placeholder="לדוגמה: המשך ישר 10 מטר ואז פנה ימינה"
    ></textarea>

  </div>


  <button id="saveButton">
    שמור את הניווט
  </button>

  <div id="saveStatus"></div>

</div>


<script>

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const compileButton =
  document.getElementById("compileButton");

const status =
  document.getElementById("status");

const saveButton =
  document.getElementById("saveButton");

const saveStatus =
  document.getElementById("saveStatus");

let selectedFile = null;
let exportedBuffer = null;



imageInput.addEventListener(
  "change",
  function(event) {

    selectedFile =
      event.target.files[0];

    if (!selectedFile) {
      return;
    }

    const url =
      URL.createObjectURL(selectedFile);

    preview.src = url;

    preview.style.display =
      "block";

    status.innerText =
      "התמונה מוכנה";

  }
);



function loadImage(file) {

  return new Promise(
    (resolve, reject) => {

      const image =
        new Image();

      image.onload =
        () => resolve(image);

      image.onerror =
        () => reject(
          new Error(
            "לא ניתן לטעון את התמונה"
          )
        );

      image.src =
        URL.createObjectURL(file);

    }
  );

}



compileButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {

      alert(
        "קודם צלם או בחר תמונה"
      );

      return;

    }


    try {

      compileButton.disabled =
        true;

      status.innerText =
        "מכין Marker...";


      const image =
        await loadImage(
          selectedFile
        );


      const compiler =
        new window.MINDAR.IMAGE.Compiler();


      await compiler.compileImageTargets(
        [image],

        function(progress) {

          status.innerText =
            "Creating Marker: "
            +
            progress.toFixed(0)
            +
            "%";

        }
      );


      exportedBuffer =
        await compiler.exportData();


      status.innerHTML =
        "✅ Marker מוכן";

      status.className =
        "success";


      saveButton.style.display =
        "block";

    }

    catch(error) {

      console.error(error);

      status.innerText =
        "❌ שגיאה ביצירת Marker";

      alert(error.message);

    }

    finally {

      compileButton.disabled =
        false;

    }

  }
);



function bufferToBase64(buffer) {

  let binary = "";

  const bytes =
    new Uint8Array(buffer);

  for (
    let i = 0;
    i < bytes.length;
    i++
  ) {

    binary +=
      String.fromCharCode(
        bytes[i]
      );

  }

  return btoa(binary);

}



saveButton.addEventListener(
  "click",
  function() {

    const routeName =
      document
        .getElementById("routeName")
        .value
        .trim();

    const markerName =
      document
        .getElementById("markerName")
        .value
        .trim();

    const direction =
      document
        .getElementById("direction")
        .value;

    const instruction =
      document
        .getElementById("instruction")
        .value
        .trim();


    if (!routeName) {

      alert(
        "הכנס שם ליעד"
      );

      return;

    }


    if (!exportedBuffer) {

      alert(
        "צריך ליצור Marker קודם"
      );

      return;

    }


    const route = {

      id:
        Date.now().toString(),

      name:
        routeName,

      markerName:
        markerName,

      direction:
        direction,

      instruction:
        instruction,

      targetData:
        bufferToBase64(
          exportedBuffer
        )

    };


    localStorage.setItem(
      "last50_route",
      JSON.stringify(route)
    );


    saveStatus.innerHTML =
      "<p class='success'>✅ הניווט נשמר</p>";

  }
);

</script>

</body>
</html>
