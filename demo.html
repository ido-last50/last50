<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Last50 AR Demo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      margin: 0 !important;
      padding: 0 !important;
    }

    .a-canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #overlay {
      position: fixed;

      z-index: 1000;

      top: env(safe-area-inset-top, 20px);

      left: 20px;
      right: 20px;

      padding-top: 15px;

      text-align: center;

      color: white;

      font-family:
        Arial,
        sans-serif;

      font-size: 20px;
      font-weight: bold;

      text-shadow:
        0 2px 8px black;

      pointer-events: none;
    }

  </style>

</head>


<body>


<!-- כותרת על המסך -->

<div id="overlay">

  Last50 AR Demo

</div>



<!-- AR SCENE -->

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    uiLoading: yes;
    uiScanning: yes;
    uiError: yes;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    antialias: true;
    alpha: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  "

  embedded

>


  <!-- CAMERA -->

  <a-camera

    position="0 0 0"

    look-controls="
      enabled: false
    "

  >

  </a-camera>



  <!--
      MARKER TARGET

      targetIndex: 0
      =
      ה-Marker הראשון
      בתוך targets.mind
  -->

  <a-entity

    mindar-image-target="
      targetIndex: 0
    "

  >


    <!-- גוף החץ -->

    <a-box

      position="
        0
        0.10
        0.10
      "

      scale="
        0.12
        0.45
        0.06
      "

      color="#00A8FF"

    >

    </a-box>



    <!-- ראש החץ -->

    <a-cone

      position="
        0
        0.48
        0.10
      "

      radius-bottom="0.22"

      radius-top="0"

      height="0.32"

      color="#00A8FF"

    >

    </a-cone>



    <!-- טקסט ניווט -->

    <a-text

      value="GO STRAIGHT"

      position="
        0
        0.85
        0.10
      "

      align="center"

      width="2.5"

      color="#FFFFFF"

    >

    </a-text>


  </a-entity>


</a-scene>


</body>
</html>
